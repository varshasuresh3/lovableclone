<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<div class="container">
    <input type="text" id="num1" class="input-field" placeholder="Enter first number">
    <select id="operation" class="operation-select">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option></select>
    <input type="text" id="num2" class="input-field" placeholder="Enter second number">
    <button id="calculate" class="operator-button">Calculate</button>
    <input type="text" id="result" class="display-field" placeholder="Result" readonly>
</div>
<footer></footer>
<script src="../static/script.js"></script>
<script>
    import { render_template } from "flask";
    import Calculator from "Calculator";
    document.getElementById("calculate").addEventListener("click", function() {
        const num1 = document.getElementById("num1").value;
        const operation = document.getElementById("operation").value;
        const num2 = document.getElementById("num2").value;
        const result = Calculator.calculate(num1, operation, num2);
        document.getElementById("result").value = result;
    });
</script>
</body>
</html>
